<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Baloo 2";font-weight:600;font-display:swap;src:url(fonts/baloo2-600.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(fonts/baloo2-800.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-400.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-700.woff2) format("woff2")}
:root{
  /* Layout: one phone column. Score chips, the painted board, then the dice tray.
     World: a hand-painted Ludo board laid on indigo-dyed cloth. Single theme by choice. */
  --cloth:#121938;
  --cloth-2:#1b2450;
  --ink:#f4f0e3;
  --muted:#aab2da;
  --board:#f4f0e3;
  --line:#161c3d;
  --red:#d7302c;
  --green:#0f8a48;
  --yellow:#f0bf00;
  --blue:#2a66cf;
  --accent:#f0bf00;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
button,.board,.chips,.tray,.photo{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tok.can::after{content:"";position:absolute;inset:-38%}
body{
  margin:0;background:var(--cloth);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 7px);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1;margin:0;letter-spacing:.01em}
h1 span{color:var(--accent)}
.sub{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.lang{display:flex;border:1.5px solid var(--muted);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:8px 12px;font-weight:700;font-size:.8rem;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--cloth)}

.chips{display:flex;gap:6px}
.chip{flex:1;min-width:0;background:var(--cloth-2);border-radius:12px;padding:7px 8px;border:2px solid transparent;display:flex;flex-direction:column;gap:1px}
.chip.on{border-color:var(--ink);background:#26306a}
.chip b{display:flex;align-items:center;gap:5px;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.75)}
.chip small{color:var(--muted);font-size:.76rem;font-weight:600;font-variant-numeric:tabular-nums}

.board{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:5px solid #0b102a;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tok{position:absolute;width:6.6667%;height:6.6667%;padding:0;border:0;background:none;transition:left .13s linear,top .13s linear;z-index:2;cursor:default}
.tok.slow{transition:left .42s ease,top .42s ease}
.tok span{position:absolute;inset:11%;border-radius:50%;border:2px solid #0b102a;transform:scale(var(--s,1));transition:transform .15s;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 42%),var(--c);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.tok.can{z-index:5;cursor:pointer}
.tok.can span{border-color:#fff;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.95),0 2px 3px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 5px rgba(255,255,255,.25),0 2px 3px rgba(0,0,0,.45)}}

.tray{display:flex;align-items:center;gap:12px;background:var(--cloth-2);border-radius:16px;padding:10px 12px;min-height:76px}
.dice{display:flex;gap:8px;flex:none}
.die{width:54px;height:54px;border-radius:12px;background:#fff;border:3px solid transparent;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:2px}
.die u{border-radius:50%}
.die u.p{background:var(--line)}
.die.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,191,0,.35)}
.die.used{opacity:.3}
.die.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
.status{flex:1;min-width:0;font-weight:600;font-size:.95rem}
.roll{flex:none;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--accent);color:#1a1500;border:0;border-radius:14px;padding:6px 20px;min-height:54px;box-shadow:0 4px 0 #9a7a00}
.roll:active{transform:translateY(2px);box-shadow:0 2px 0 #9a7a00}
.roll:disabled{opacity:.35;cursor:default;box-shadow:none}
.timer{display:flex;align-items:center;gap:10px;height:14px;margin:-4px 2px}
.timer.off{visibility:hidden}
.timer div{flex:1;height:8px;border-radius:99px;background:var(--cloth-2);overflow:hidden}
.timer i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .1s linear}
.timer.low i{background:var(--red)}
.timer span{width:2.2em;text-align:right;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#btn-new,#btn-online{flex:1 1 40%}
#btn-online{background:var(--ink);color:var(--cloth);border-color:var(--ink)}
.code{text-align:center;background:rgba(0,0,0,.25);border-radius:14px;padding:10px}
.code small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.code b{font-family:var(--display);font-size:2.2rem;letter-spacing:.14em;color:var(--accent);line-height:1.1;-webkit-user-select:all;user-select:all}
#join-code{text-transform:uppercase;letter-spacing:.14em;font-family:var(--display);font-size:1.15rem}
.foot{margin:6px 0 0;text-align:center;font-size:.72rem;color:var(--muted)}
.actions button{flex:1 1 25%;min-width:0;background:none;border:1.5px solid var(--muted);border-radius:12px;padding:10px 4px;font-size:.86rem;font-weight:700;min-height:46px}

.sheet{position:fixed;inset:0;background:rgba(6,9,26,.78);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--cloth-2);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
.panel>*{flex-shrink:0}
.panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel h2{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.1;text-wrap:balance}
.panel h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:1.5px solid var(--muted);border-radius:10px;padding:9px 8px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cloth);border-color:var(--ink)}
.seats{display:flex;flex-direction:column;gap:6px}
.seat{display:flex;align-items:center;gap:10px}
.seat i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;flex:none}
.seat b{width:64px;flex:none;font-size:.9rem}
.seat .seg{flex:1}
.check{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.95rem}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pot{font-size:.8rem;color:var(--muted);text-align:center;font-weight:600;margin:-4px 0}
.seatbox{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:rgba(0,0,0,.2)}
.who{display:flex;align-items:center;gap:10px}
.who input{flex:1;min-width:0;font:inherit;font-weight:600;padding:9px 12px;border-radius:10px;border:1.5px solid var(--muted);background:var(--cloth);color:var(--ink);min-height:44px}
.who input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.bal{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.avs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.avs button,.photo{flex:none;width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:var(--cloth);font-size:1.4rem;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.avs button[aria-pressed="true"],.photo.on{border-color:var(--accent)}
.photo{width:auto;padding:0 12px;font-size:.85rem;font-weight:700;gap:6px;cursor:pointer;border-color:var(--muted)}
.photo img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.photo:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.stakes .seg button{flex:1 0 17%;padding-left:2px;padding-right:2px;font-size:.9rem;font-variant-numeric:tabular-nums}
.seg button:disabled{opacity:.3;cursor:default}
.note{margin:8px 0 0;font-size:.8rem;color:var(--muted)}
.warn,.err{margin:0;font-size:.88rem;font-weight:600;color:#ffb4a8}
.err:empty{display:none}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.places li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.places em{font-style:normal;font-weight:800;font-family:var(--display);width:2.2em;color:var(--accent)}
.places i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.places b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.places span{font-weight:700;white-space:nowrap}
.lbwrap{overflow-x:auto}
.lb{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.lb th{font-size:.62rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;text-align:right;padding:4px 4px;white-space:nowrap}
.lb td{padding:9px 4px;text-align:right;border-top:1px solid rgba(255,255,255,.12);white-space:nowrap}
.lb th:first-child,.lb td:first-child{text-align:left}
.lb td:first-child{font-weight:700;display:flex;align-items:center;gap:8px}
.lb td:nth-child(2){color:var(--accent);font-weight:700}
.lb .av{width:26px;height:26px;border-radius:7px;background:var(--cloth);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex:none;overflow:hidden}
.lb .av img{width:100%;height:100%;object-fit:cover}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.85rem}
.hist small{display:block;color:var(--muted)}
.chip small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{min-width:0}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.cta{font-family:var(--display);font-weight:800;font-size:1.15rem;background:var(--accent);color:#1a1500;border:0;border-radius:14px;min-height:52px}
.ghost{background:none;border:1.5px solid var(--muted);border-radius:14px;min-height:48px;font-weight:700}
.win{align-items:center}
.win .panel{border-radius:20px;text-align:center;max-width:340px;margin:16px}
.win .dot{width:64px;height:64px;border-radius:50%;margin:0 auto;border:4px solid #fff}
@media (max-width:370px){
  .app{padding-left:12px;padding-right:12px;gap:10px}
  .chips{gap:4px}.chip{padding:6px 5px}.chip b{font-size:.74rem;gap:4px}.chip i{width:9px;height:9px}.chip small{font-size:.68rem}
  h1{font-size:1.5rem}.roll{padding:6px 14px}.die{width:48px;height:48px}.tray{gap:8px;padding:8px 10px}.status{font-size:.88rem}
  .actions button{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){.tok,.tok.slow{transition:none}.tok.can span,.die.shake{animation:none}}
</style>

<body>
<div class="app">
  <header>
    <div>
      <h1>Ludo <span>Teranga</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" type="button">EN</button>
      <button id="lang-fr" type="button">FR</button>
    </div>
  </header>

  <div class="chips" id="chips"></div>
  <div class="pot" id="pot"></div>

  <div class="board" id="board"><svg id="svg" viewBox="0 0 15 15" aria-hidden="true"></svg></div>

  <div class="tray">
    <div class="dice" id="dice"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="roll" id="roll" type="button"></button>
  </div>

  <div class="timer off" id="timer"><div><i id="tbar"></i></div><span id="tnum"></span></div>

  <div class="actions">
    <button id="btn-new" type="button"></button>
    <button id="btn-online" type="button"></button>
    <button id="btn-rules" type="button"></button>
    <button id="btn-scores" type="button"></button>
    <button id="btn-sound" type="button"></button>
  </div>
  <p class="foot">&copy; 2026 Nioro Resources LLC</p>
</div>

<div class="sheet" id="sheet-setup"><div class="panel" id="panel-setup"></div></div>
<div class="sheet" id="sheet-rules"><div class="panel" id="panel-rules"></div></div>
<div class="sheet" id="sheet-online"><div class="panel" id="panel-online"></div></div>
<div class="sheet" id="sheet-scores"><div class="panel" id="panel-scores"></div></div>
<div class="sheet win" id="sheet-win"><div class="panel" id="panel-win"></div></div>

<script src="config.js"></script>
<script>
/*ENGINE-START*/
// Main track, 52 squares, clockwise from Red's start square. [row, col]
var PATH=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],
[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]];
var STARTS=[0,13,26,39], STARS=[8,21,34,47];
// Progress per piece: -1 yard, 0..50 main track, 51..55 home column, 56 home.
function absIdx(seat,p){return (seat*13+p)%52}
function isSafe(g,idx){return g.opts.safe&&(STARS.indexOf(idx)>=0||STARTS.indexOf(idx)>=0)}
function newGame(cfg){
  return {players:cfg.seats.map(function(s){return {seat:s.seat,kind:s.kind,tokens:[-1,-1,-1,-1]}}),
    opts:{twoDice:!!cfg.twoDice,safe:!!cfg.safe,blockPass:!!cfg.blockPass,bonus:!!cfg.bonus,captureHome:!!cfg.captureHome,jail:!!cfg.jail,homeBonus:!!cfg.homeBonus},
    turn:0,dice:[],rolled:null,bonus:false,winner:-1,rank:[],over:false};
}
function enemyBlock(g,pi,idx){
  if(isSafe(g,idx))return false;
  for(var oi=0;oi<g.players.length;oi++){
    if(oi===pi)continue;var op=g.players[oi],n=0;
    for(var k=0;k<4;k++){var q=op.tokens[k];if(q>=0&&q<=50&&absIdx(op.seat,q)===idx)n++}
    if(n>=2)return true;
  }
  return false;
}
// Returns the destination progress, or null when the move is not allowed.
function canMove(g,pi,ti,die){
  var pl=g.players[pi],p=pl.tokens[ti],np;
  if(p===56)return null;
  if(p<=-10)return die===6?-1:null; // held in another player's house: a 6 takes it back to its own
  if(p===-1){if(die!==6)return null;np=0}
  else{np=p+die;if(np>56)return null}
  var first=g.opts.blockPass?(p===-1?0:p+1):np;
  for(var s=first;s<=np&&s<=50;s++){if(enemyBlock(g,pi,absIdx(pl.seat,s)))return null}
  return np;
}
function legalMoves(g,pi,die){var r=[];for(var t=0;t<4;t++){if(canMove(g,pi,t,die)!==null)r.push(t)}return r}
function applyMove(g,pi,ti,die){
  var pl=g.players[pi],from=pl.tokens[ti],np=canMove(g,pi,ti,die),captured=[];
  pl.tokens[ti]=np;
  if(np>=0&&np<=50){
    var idx=absIdx(pl.seat,np);
    if(!isSafe(g,idx)){
      g.players.forEach(function(op,oi){
        if(oi===pi)return;
        op.tokens.forEach(function(q,k){if(q>=0&&q<=50&&absIdx(op.seat,q)===idx){op.tokens[k]=g.opts.jail?-(10+pi):-1;captured.push({pi:oi,ti:k})}});
      });
    }
  }
  if(captured.length){if(g.opts.bonus)g.bonus=true;if(g.opts.captureHome)pl.tokens[ti]=56}
  if(g.opts.homeBonus&&pl.tokens[ti]===56)g.bonus=true; // a piece safely home earns another roll
  if(g.rank.indexOf(pi)<0&&pl.tokens.every(function(q){return q===56})){
    g.rank.push(pi);if(g.winner<0)g.winner=pi;
    if(g.rank.length>=g.players.length-1)g.over=true;
  }
  return {from:from,to:np,captured:captured};
}
function rollDice(g,rng){
  var n=g.opts.twoDice?2:1;g.dice=[];
  for(var i=0;i<n;i++)g.dice.push(1+Math.floor(rng()*6));
  g.rolled=g.dice.slice();g.bonus=false;
}
function playableDice(g){var r=[];g.dice.forEach(function(d,i){if(legalMoves(g,g.turn,d).length)r.push(i)});return r}
// Ends the current roll. Returns true when the same player rolls again.
function endRoll(g){
  var r=g.rolled||[],again=g.bonus||(g.opts.twoDice?(r[0]===6&&r[1]===6):r[0]===6);
  g.dice=[];g.rolled=null;g.bonus=false;
  if(g.over)return false;
  if(g.rank.indexOf(g.turn)>=0)again=false;
  if(!again){do{g.turn=(g.turn+1)%g.players.length}while(g.rank.indexOf(g.turn)>=0)}
  return again;
}
function threat(g,pi,idx){
  if(isSafe(g,idx))return 0;
  var reach=g.opts.twoDice?12:6,n=0;
  g.players.forEach(function(op,oi){
    if(oi===pi)return;
    op.tokens.forEach(function(q){
      if(q>=0&&q<=50){var d=(idx-absIdx(op.seat,q)+52)%52;if(d>=1&&d<=reach&&q+d<=50)n+=1}
      else if(q===-1&&absIdx(op.seat,0)===idx)n+=0.5;
    });
  });
  return n;
}
function scoreMove(g,pi,ti,die){
  var pl=g.players[pi],p=pl.tokens[ti],np=canMove(g,pi,ti,die);
  if(np===null)return -Infinity;
  if(p<=-10)return 22;
  var s=die+np*0.2;
  if(p===-1)s+=35;
  if(np===56)s+=60;
  else if(np>50)s+=12;
  else{
    var idx=absIdx(pl.seat,np),block=pl.tokens.some(function(q,j){return j!==ti&&q===np});
    if(isSafe(g,idx))s+=10;
    else g.players.forEach(function(op,oi){if(oi!==pi)op.tokens.forEach(function(q){if(q>=0&&q<=50&&absIdx(op.seat,q)===idx)s+=55+q})});
    if(block)s+=14;else s-=threat(g,pi,idx)*(8+np*0.5);
  }
  if(p>=0&&p<=50)s+=threat(g,pi,absIdx(pl.seat,p))*(6+p*0.4);
  return s;
}
function chooseMove(g){

// ---------- Turn flow ----------

function beginTurn(){
  phase="roll";idleAt=Date.now();renderAll();say(rollMsg());startClock();
  if(!live()){try{localStorage.setItem("ludo-game3",JSON.stringify(g))}catch(e){}}
  if(control(g.turn)==="cpu")later(doRoll,750);
  pumpEvents();

function doRoll(){
  if(phase!=="roll")return;
  var n=g.opts.twoDice?2:1,vals=[];
  for(var i=0;i<n;i++)vals.push(1+Math.floor(Math.random()*6));
  if(live())pushEv({t:"r",d:vals});

}
function showRoll(vals){
  stopClock();sfx("roll");
  phase="anim";$("roll").disabled=true;
  var n=vals.length,ticks=reduced?0:7,e=epoch;
  (function tick(){
    if(e!==epoch)return;
    if(ticks-->0){var v=[];for(var i=0;i<n;i++)v.push(1+Math.floor(Math.random()*6));renderDice(v);setTimeout(tick,85);return}
    g.dice=vals.slice();g.rolled=vals.slice();g.bonus=false;selDie=0;step();
  })();
}
function options(){
  var seen={},r=[];
  g.dice.forEach(function(d,di){if(seen[d])return;seen[d]=1;legalMoves(g,g.turn,d).forEach(function(ti){r.push({ti:ti,di:di})})});

}
function step(){
  var pd=playableDice(g);

    if(g.dice.length){say(L().noMove);sfx("nomove");later(finish,900)}else finish();
    return;
  }
  if(pd.indexOf(selDie)<0)selDie=pd[0];
  phase="move";idleAt=Date.now();renderAll();
  var who=control(g.turn);
  if(who!=="me"){
    say(L().thinking(nameOf(g.turn)));
    if(who==="cpu")later(function(){var m=chooseMove(g);doMove(m.ti,m.di)},700);
    pumpEvents();return;
  }
  var op=options();
  if(op.length===1){say(L().pick);later(function(){doMove(op[0].ti,op[0].di)},550)}
  else{say(g.opts.twoDice&&g.dice.length===2&&g.dice[0]!==g.dice[1]?L().pickDie:L().pick);startClock()}
}

function onDie(di){
  if(phase!=="move"||di<0||!isHuman(g.turn))return;

}
function onToken(pi,ti){
  if(phase!=="move"||pi!==g.turn||!isHuman(pi))return;
  if(canMove(g,pi,ti,g.dice[selDie])===null)return;
  doMove(ti,selDie);
}
async function doMove(ti,di,remote){
  if(phase!=="move")return;
  if(live()&&!remote)pushEv({t:"m",ti:ti,di:di});
  phase="anim";stopClock();
  var e=epoch,pi=g.turn,pl=g.players[pi],die=g.dice[di],el=$("tok-"+pi+"-"+ti);
  var was=g.rank.length,res=applyMove(g,pi,ti,die),caps=res.captured.length,home=pl.tokens[ti]===56,placed=g.rank.length>was,rankNo=g.rank.length;
  g.dice.splice(di,1);selDie=0;
  var gain=award(pi,PTS_CAP*caps)+(home?award(pi,PTS_HOME):0);
  stat(pi,"caps",caps);
  if(placed){g.gains[pi]=award(pi,potShare(rankNo,g.players.length,g.pot)+BONUS[rankNo-1]);gain+=g.gains[pi]}

  if(caps||freed)slow.forEach(function(n){n.classList.add("slow")});
  if(caps||home||freed)say((placed?L().finishMsg(pl.name,L().ord[rankNo-1]):caps?(g.opts.jail?L().caughtTo(pl.name):L().captured):freed?L().freed:L().homeIn)+(gain?" +"+fmt(gain)+" ★":""));

// ---------- Online play: private games shared through the site's realtime database ----------
// Every device runs the same rules. Only the inputs travel: dice values, the piece chosen, a timeout.
var DB=((window.LUDO_CONFIG&&window.LUDO_CONFIG.databaseURL)||"").replace(/\/+$/,"");
var net=null,idleAt=0,myId=null,onErr="",pendingCode="",joinTries=0;
try{myId=localStorage.getItem("ludo-id")}catch(e){}
if(!myId){myId="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem("ludo-id",myId)}catch(e){}}
try{pendingCode=(new URLSearchParams(location.search).get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)}catch(e){}
function live(){return !!(net&&net.live)}
function roomUrl(code,path){return DB+"/rooms/"+code+(path||"")+".json"}
function api(method,path,body,code){

    .then(function(r){if(!r.ok)throw new Error("net");return r.json()});
}

function seatAt(r,i){return r&&r.seats?r.seats[i]:undefined}

function fresh(id){return id===myId||Date.now()-(net.seen[id]||net.since)<25000}
function actingHost(){
  var r=net.room,ss=(r.game&&r.game.seats)||[];
  if(fresh(r.host))return r.host;
  for(var i=0;i<ss.length;i++)if(ss[i].kind==="human"&&fresh(ss[i].id))return ss[i].id;
  return myId;
}
// Who plays a seat on this device: "me", "cpu" (this device plays it), or "remote" (wait for another device).
function control(pi){
  var pl=g.players[pi];
  if(!live())return pl.kind==="human"?"me":"cpu";
  if(pl.kind==="human"&&pl.id===myId)return "me";
  if(pl.kind==="human"&&fresh(pl.id))return "remote";

}
function turnSecs(){return live()?((net.room.cfg&&net.room.cfg.timer)||30):cfg.timer}
function cleanAv(av,seat){
  if(av&&av.t==="i"&&typeof av.v==="string"&&av.v.length<24000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(av.v))return {t:"i",v:av.v};
  if(av&&av.t==="e"&&typeof av.v==="string"&&av.v.length<=8)return {t:"e",v:av.v};

function pushEv(e){

// Applies one input to the game without any animation. Used to catch up after joining or reconnecting.
function simEvent(gm,e){
  if(e.t==="r"){gm.dice=e.d.slice();gm.rolled=e.d.slice();gm.bonus=false}
  else if(e.t==="m"){applyMove(gm,gm.turn,e.ti,gm.dice[e.di]);gm.dice.splice(e.di,1)}

function pumpEvents(){

  net.log[net.applied++]=canon(e);

}

  var c=r.cfg||{};

  net.live=true;net.round=r.round;net.applied=0;net.log=[];
  g=newGame({seats:gm.seats.map(function(s){return {seat:s.seat,kind:s.kind==="human"?"human":"cpu"}}),twoDice:c.twoDice,safe:c.safe,blockPass:c.blockPass,bonus:c.bonus,captureHome:c.captureHome,jail:c.jail,homeBonus:c.homeBonus});
  g.stake=c.stake||0;g.pot=g.stake*g.players.length;g.gains={};g.v=3;
  g.players.forEach(function(pl,i){
    var s=gm.seats[i];
    pl.name=String(s.name||"").slice(0,12)||CPU_NAMES[pl.seat];pl.av=cleanAv(s.av,pl.seat);pl.id=s.id||null;pl.key=null;
    if(pl.kind==="human"&&pl.id===myId){
      var k=keyOf(pl.name),pr=bank.profiles[k],tag=net.code+":"+r.round,paid="";
      if(!pr)pr=bank.profiles[k]={name:pl.name,pts:WELCOME,av:pl.av,t:0};
      pl.key=k;
      try{paid=localStorage.getItem("ludo-paid")||""}catch(e){}
      if(g.stake&&paid!==tag){pr.pts=Math.max(0,pr.pts-g.stake);pr.t=Date.now();try{localStorage.setItem("ludo-paid",tag)}catch(e){}}
      saveBank();
    }
  });

function setPath(path,val){
  var parts=String(path).split("/").filter(Boolean);

function onRoom(){

    renderOnline();$("sheet-online").classList.add("open");return;

    seats:{0:{id:myId,name:meName(),av:meAv()}}};

function joinRoom(code){
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  onErr="";saveCfg();
  if(code.length!==6){onErr=L().errNoRoom;renderOnline();return}
  api("GET","",undefined,code).then(function(r){
    if(!r||!r.cfg){try{localStorage.removeItem("ludo-room")}catch(e){}onErr=L().errNoRoom;renderOnline();return}
    var n=r.cfg.count,free=-1;
    for(var i=0;i<n;i++)if(!seatAt(r,i)&&free<0)free=i;
    if(hasMe(r)){enter(code,r);onRoom();return}
    if(r.status!=="lobby"){onErr=L().errStarted;renderOnline();return}
    if(free<0){onErr=L().errFull;renderOnline();return}
    if((r.cfg.stake||0)>balanceOf(meName())){onErr=L().errPoints(fmt(r.cfg.stake));renderOnline();return}
    var seat={id:myId,name:meName(),av:meAv()};
    return api("PUT","/seats/"+free,seat,code).then(function(){
      if(!r.seats)r.seats={};r.seats[free]=seat;pendingCode="";enter(code,r);onRoom();
    });
  }).catch(function(){onErr=L().errNet;renderOnline()});
}

function readPhoto(file,cb){

    var im=new Image();
    im.onload=function(){
      var c=document.createElement("canvas"),S=128,m=Math.min(im.width,im.height);c.width=c.height=S;
      try{c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);cb(c.toDataURL("image/jpeg",0.72))}catch(e){cb(null)}

  };

}

  var hs=bank.history||[];
  if(!hs.length)h+='<p class="note" style="margin:0">'+t.noGames+'</p>';
  else h+='<ol class="hist">'+hs.map(function(x){
    var d=new Date(x.t).toLocaleDateString(lang==="fr"?"fr-FR":"en-US",{day:"numeric",month:"short"});
    return '<li>'+x.names.map(function(n,i){return (i+1)+". "+esc(n)}).join(" · ")+'<small>'+d+(x.pot?" · "+t.potWord+" "+fmt(x.pot)+" ★":"")+'</small></li>';
  }).join("")+'</ol>';
  h+='</div><button type="button" class="ghost" id="scores-close">'+t.close+'</button>';
  $("panel-scores").innerHTML=h;
  $("scores-close").addEventListener("click",closeSheets);
  $("sheet-scores").classList.add("open");
}
function closeSheets(){["sheet-setup","sheet-rules","sheet-scores","sheet-online","sheet-win"].forEach(function(id){$(id).classList.remove("open")})}
function setLang(l){
  lang=l;try{localStorage.setItem("ludo-lang",l)}catch(e){}
  renderAll();
  if(phase==="roll")say(rollMsg());
  else if(phase==="move"&&isHuman(g.turn))say(L().pick);
}

$("roll").addEventListener("click",function(){if(isHuman(g.turn))doRoll()});
$("btn-new").addEventListener("click",function(){renderSetup();$("sheet-setup").classList.add("open")});
$("btn-scores").addEventListener("click",openScores);
$("btn-online").addEventListener("click",function(){onErr="";openOnline()});
$("btn-sound").addEventListener("click",function(){
  soundOn=!soundOn;try{localStorage.setItem("ludo-sound",soundOn?"1":"0")}catch(e){}
  renderAll();
  if(soundOn){
    wake();sfx("home");
    setTimeout(function(){if(soundOn&&(!AC||AC.state!=="running"))say(L().soundBlocked)},700);
  }else if(hush)hush.pause();
});
$("btn-rules").addEventListener("click",function(){renderRules();$("sheet-rules").classList.add("open")});
$("lang-en").addEventListener("click",function(){setLang("en")});
$("lang-fr").addEventListener("click",function(){setLang("fr")});
["sheet-setup","sheet-rules","sheet-scores"].forEach(function(id){$(id).addEventListener("click",function(ev){if(ev.target===$(id))closeSheets()})});

// ---------- Boot: resumes a game in progress after a reload ----------
function validGame(x){return x&&x.v===3&&x.rank&&x.players&&x.players.length>=2&&x.players[0].name&&x.opts&&typeof x.turn==="number"}
var firstVisit=false;
function boot(data){
  try{firstVisit=!localStorage.getItem("ludo-cfg2")}catch(e){}
  try{var c=localStorage.getItem("ludo-cfg2");if(c){var cj=JSON.parse(c);if(cj&&cj.kinds&&cj.names&&cj.avs)cfg=cj}}catch(e){}
  if(typeof cfg.timer!=="number")cfg.timer=15;
  if(typeof cfg.jail!=="boolean")cfg.jail=true;
  if(typeof cfg.homeBonus!=="boolean")cfg.homeBonus=true;
  if(renamePlayer("Ndeye","Yama"))saveLocal();
  var saved=null;
  if(!saved){try{var s=localStorage.getItem("ludo-game3");if(s){var sj=JSON.parse(s);if(validGame(sj)&&!sj.over)saved=sj}}catch(e){}}
  if(saved){
    g=saved;renamePlayer("Ndeye","Yama");
    try{localStorage.setItem("ludo-cfg2",JSON.stringify(cfg))}catch(e){}
    epoch++;mount();
    if(g.over){phase="over";renderAll();showWin()}
    else if(g.dice&&g.dice.length){selDie=0;step()}
    else{g.dice=[];g.rolled=null;beginTurn()}
  }else{
    cfg.stake=0;startGame();
    if(firstVisit){renderSetup();$("sheet-setup").classList.add("open")}
  }
  var savedRoom="";
  try{savedRoom=localStorage.getItem("ludo-room")||""}catch(e){}
  if(DB&&pendingCode){closeSheets();if(savedRoom===pendingCode)joinRoom(pendingCode);else openOnline()}
  else if(DB&&savedRoom)joinRoom(savedRoom);
}
boot({});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
